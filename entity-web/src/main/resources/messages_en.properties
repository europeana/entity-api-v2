#set api messages

#400
error.entity_unsupported_type=Unsupported {0} type: {1}, should be one of: agent, concept, place, organization, timespan!
error.algorithm_unsupported_type=Unsupported search algorithm type: {0}, should be one of: monolingual, suggestByLabel!

# 404 (Not Found - client must not issue the same call again)
error.entity_same_as_not_found=No {0} found for sameAs/exactMatch URI: {1}

# 500 (Internal Server Error - runtime exceptions; might be temporarily, infrastructure problems)
error.entity_server_cannot_retrieve_uri=Internal server error occurred when retrieving entity by URI: {0}
error.entity_server_cannot_serialize_object=Internal server error occurred when serializing object: {0}

resources:
  - deployment.yaml

labels:
  - includeSelectors: true
    pairs:
      app: entity-api-v2

# expects files to be in the same directory
secretGenerator:
  - name: entity-api-v2-secret
    files:
      - entity.properties
      
#generate config mapping for log4j2.xml file
configMapGenerator:
  - name: log4j2-properties
    files:
      - log4j2-spring.xml